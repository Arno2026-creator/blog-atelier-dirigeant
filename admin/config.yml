backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"
locale: fr

collections:
  - name: "articles"
    label: "Articles du blog"
    label_singular: "Article"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    fields:
      - label: "Titre"
        name: "title"
        widget: "string"
      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        format: "MMMM YYYY"
        date_format: "MMMM YYYY"
        time_format: false
      - label: "Temps de lecture (minutes)"
        name: "read_time"
        widget: "number"
        default: 5
      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Créer & Reprendre", value: "Créer & Reprendre" }
          - { label: "Ouvrir", value: "Ouvrir" }
          - { label: "Piloter", value: "Piloter" }
          - { label: "Recruter", value: "Recruter" }
          - { label: "Développer", value: "Développer" }
          - { label: "Rentabiliser", value: "Rentabiliser" }
      - label: "Description (extrait)"
        name: "description"
        widget: "text"
      - label: "Image à la une"
        name: "featured_image"
        widget: "image"
        required: false
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - label: "Contenu de l'article"
        name: "body"
        widget: "markdown"